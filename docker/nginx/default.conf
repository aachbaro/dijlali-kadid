server {
    listen 80;
    server_name _;

    client_max_body_size 64M;

    # --- Durcissement post-incident 2026-07-27 ---

    # Enumeration d'utilisateurs (/?author=1)
    if ($arg_author ~ "^[0-9]+$") { return 403; }

    # XML-RPC : vecteur de brute force et d'amplification
    location = /xmlrpc.php {
        deny all;
        access_log off;
    }

    # Fichiers sensibles sondes en masse (.env, .git/config)
    location ~ /\.(env|git|svn|ht) {
        deny all;
        access_log off;
    }

    location / {
        proxy_pass          http://wordpress:80;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_buffering     off;
        proxy_read_timeout  300s;
    }
}
